<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-labelledby="vifastkey-icon-title">
  <title id="vifastkey-icon-title">ViFastKey</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#E8352B"/>
      <stop offset="1" stop-color="#B3150F"/>
    </linearGradient>
    <linearGradient id="y" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFE14D"/>
      <stop offset="1" stop-color="#FFB800"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>
  <!-- speed lines, cùng nhịp với icon ViFastTts -->
  <g stroke="#FFD84D" stroke-width="14" stroke-linecap="round" opacity="0.85">
    <line x1="40" y1="215" x2="92" y2="215"/>
    <line x1="58" y1="262" x2="92" y2="262"/>
    <line x1="40" y1="309" x2="92" y2="309"/>
  </g>
  <!-- ngôi sao vàng, cùng tỉ lệ/vị trí với ViFastTts -->
  <polygon points="210.0,144.0 236.5,225.5 322.2,225.5 252.9,275.9 279.4,357.5 210.0,307.1 140.6,357.5 167.1,275.9 97.8,225.5 183.5,225.5" fill="url(#y)" stroke="#FFE680" stroke-width="4" stroke-linejoin="round"/>
  <!-- bàn phím: 3x3 phím + phím cách -->
  <g fill="#FFFFFF">
    <rect x="348" y="176" width="34" height="34" rx="8"/>
    <rect x="391" y="176" width="34" height="34" rx="8" opacity="0.78"/>
    <rect x="434" y="176" width="34" height="34" rx="8" opacity="0.5"/>
    <rect x="348" y="219" width="34" height="34" rx="8"/>
    <rect x="391" y="219" width="34" height="34" rx="8" opacity="0.78"/>
    <rect x="434" y="219" width="34" height="34" rx="8" opacity="0.5"/>
    <rect x="348" y="262" width="34" height="34" rx="8"/>
    <rect x="391" y="262" width="34" height="34" rx="8" opacity="0.78"/>
    <rect x="434" y="262" width="34" height="34" rx="8" opacity="0.5"/>
    <rect x="348" y="314" width="120" height="22" rx="10" opacity="0.85"/>
  </g>
