services:
  vifastkey:
    build: .
    container_name: vifastkey
    restart: unless-stopped
    environment:
      DATA_DIR: "/app/data"
      SITE_URL: "https://vifastkey.hoctuthien.com"
      ALLOWED_HOSTS: "vifastkey.hoctuthien.com,localhost,127.0.0.1"
      ADMIN_PASSWORD: "${ADMIN_PASSWORD:-}"
      STATS_SALT: "${STATS_SALT:-}"
    volumes:
      - ./data:/app/data
    expose:
      - "8000"
    networks:
      - coolify
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=coolify"
      - "traefik.http.middlewares.vifastkey-redirect.redirectscheme.scheme=https"
      - "traefik.http.middlewares.vifastkey-compress.compress=true"
      - "traefik.http.routers.vifastkey-http.rule=Host(`vifastkey.hoctuthien.com`)"
      - "traefik.http.routers.vifastkey-http.entrypoints=http"
      - "traefik.http.routers.vifastkey-http.middlewares=vifastkey-redirect"
      - "traefik.http.routers.vifastkey-http.service=vifastkey"
      - "traefik.http.routers.vifastkey-https.rule=Host(`vifastkey.hoctuthien.com`)"
      - "traefik.http.routers.vifastkey-https.entrypoints=https"
      - "traefik.http.routers.vifastkey-https.middlewares=vifastkey-compress"
      - "traefik.http.routers.vifastkey-https.tls=true"
      - "traefik.http.routers.vifastkey-https.tls.certresolver=letsencrypt"
      - "traefik.http.routers.vifastkey-https.service=vifastkey"
      - "traefik.http.services.vifastkey.loadbalancer.server.port=8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    stop_grace_period: 10s

networks:
  coolify:
    external: true
