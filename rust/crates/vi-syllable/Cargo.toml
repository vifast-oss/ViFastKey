[package]
name = "vi-syllable"
description = "Mô hình âm tiết tiếng Việt: tách âm, kiểm tra chính tả 3 trạng thái, đặt thanh (thuần, không I/O)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[features]
default = ["std"]
std = ["unicode-normalization/std"]
serde = ["dep:serde"]

[dependencies]
unicode-normalization = { workspace = true, default-features = false }
serde = { workspace = true, optional = true }
spin = { version = "0.12.3", default-features = false, features = ["once"] }
