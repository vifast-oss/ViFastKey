[package]
name = "vifastkey-settings"
description = "UI cấu hình ViFastKey cho desktop (egui)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
name = "vifastkey-settings"
path = "src/main.rs"

[dependencies]
vfk-config = { workspace = true }
vfk-engine = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
eframe = "0.32.3"
egui = "0.32.3"
rfd = "0.17"
png = "0.18"

[target.'cfg(target_os = "linux")'.dependencies]
ksni = { version = "0.3.7", features = ["blocking"] }

[target.'cfg(any(target_os = "windows", target_os = "macos"))'.dependencies]
tray-icon = { version = "0.24.2", default-features = false }

[dev-dependencies]
tempfile = "3"
