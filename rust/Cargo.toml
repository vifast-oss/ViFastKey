[workspace]
resolver = "2"
members = [
    "crates/vi-syllable",
    "crates/vfk-suggest",
    "crates/vfk-core",
    "crates/vfk-engine",
    "crates/vfk-config",
    "crates/vfk-adapter-core",
    "crates/vfk-ffi",
    "crates/vfk-wasm",
    "apps/vfk-cli",
    "apps/vfk-wayland",
    "apps/vfk-charset",
    "apps/vfk-suggest",
    "apps/vfk-windows-replace",
    "apps/vfk-jni",
    "apps/vfk-settings",
]

[workspace.package]
version = "0.1.1"
edition = "2021"
rust-version = "1.89"
license = "MIT"
repository = "https://github.com/dvchd/ViFastKey"

[workspace.dependencies]
vi-syllable = { path = "crates/vi-syllable", default-features = false }
vfk-core = { path = "crates/vfk-core" }
vfk-engine = { path = "crates/vfk-engine" }
vfk-config = { path = "crates/vfk-config" }
vfk-adapter-core = { path = "crates/vfk-adapter-core" }
vfk-suggest = { path = "crates/vfk-suggest" }
arrayvec = { version = "0.7.8", default-features = false }
unicode-normalization = { version = "0.1", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
lto = true
codegen-units = 1
panic = "unwind"   # FFI dùng catch_unwind, không đổi sang "abort"
