name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  python:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    defaults:
      run:
        working-directory: python
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: python/pyproject.toml
      - run: python -m pip install -e ".[dev]"
      - run: python -m pytest -q
      - run: ruff check .

  conformance:
    name: Conformance không lệch
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Sinh lại oracle và đồng bộ sang Rust
        run: |
          cd python
          python -m tools.export_conformance
          cd ../rust
          PYTHON=python3 tools/sync_conformance.sh ../python
      - name: Thất bại nếu dữ liệu oracle chưa được commit
        run: |
          git diff --exit-code -- \
            python/conformance \
            rust/conformance \
            python/tests/golden \
            python/tests/data \
            rust/testdata \
            python/adapters/data \
            rust/crates/vfk-engine/data \
            python/vfk_core/data \
            rust/crates/vfk-core/data \
            rust/crates/vfk-suggest/data

  rust:
    name: Rust (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    defaults:
      run:
        working-directory: rust
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
      - run: cargo run -p vfk-cli -- --demo

  macos-adapter:
    name: macOS IMK adapter
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Build app + self-test
        run: ./macos/build.sh
      - name: Upload app bundle
        uses: actions/upload-artifact@v4
        with:
          name: ViFastKey-macos-app
          path: macos/build/ViFastKey.app
          if-no-files-found: error

  wasm:
    name: WASM + web build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - name: Cài wasm-bindgen
        run: cargo install wasm-bindgen-cli --version 0.2.129 --locked
      - name: Dựng WASM
        run: |
          cd rust
          cargo build --release -p vfk-wasm --target wasm32-unknown-unknown
          wasm-bindgen --target web --out-dir ../web/pkg --out-name vfk_wasm \
            target/wasm32-unknown-unknown/release/vfk_wasm.wasm
      - name: Kiểm tra cú pháp JS
        run: node --input-type=module --check < web/app.js
