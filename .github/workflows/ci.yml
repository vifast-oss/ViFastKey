name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  python:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    defaults:
      run:
        working-directory: python
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: python/pyproject.toml
      - run: python -m pip install -e ".[dev]"
      - run: python -m pytest -q
      - run: ruff check .

  conformance:
    name: Conformance không lệch
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Sinh lại oracle và đồng bộ sang Rust
        run: |
          cd python
          python -m tools.export_conformance
          cd ../rust
          PYTHON=python3 tools/sync_conformance.sh ../python
      - name: Thất bại nếu dữ liệu oracle chưa được commit
        run: |
          git diff --exit-code -- \
            python/conformance \
            rust/conformance \
            python/tests/golden \
            python/tests/data \
            rust/testdata \
            python/adapters/data \
            rust/crates/vfk-engine/data \
            python/vfk_core/data \
            rust/crates/vfk-core/data \
            rust/crates/vfk-suggest/data

  rust:
    name: Rust (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    defaults:
      run:
        working-directory: rust
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - name: Cài thư viện GUI cho settings (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libxkbcommon-dev libwayland-dev \
            libx11-dev libxi-dev libgl1-mesa-dev libegl1-mesa-dev
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
      - run: cargo run -p vfk-cli -- --demo
      - name: Settings UI self-test (Linux)
        if: runner.os == 'Linux'
        run: |
          printf '{"input_method":"telex"}\n' > /tmp/vfk-settings.json
          cargo run -q -p vifastkey-settings -- --self-test --config /tmp/vfk-settings.json
          cargo run -q -p vifastkey-settings -- --check --config /tmp/vfk-settings.json
      - name: Settings UI screenshots (Linux headless)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb
          rm -rf /tmp/vfk-shots
          LIBGL_ALWAYS_SOFTWARE=1 xvfb-run -a -s "-screen 0 1280x800x24" \
            cargo run -q -p vifastkey-settings -- --screenshots /tmp/vfk-shots --config /tmp/vfk-settings.json
          test -s /tmp/vfk-shots/overview.png
          test -s /tmp/vfk-shots/advanced.png
      - name: Settings UI self-test (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          printf '{"input_method":"telex"}\n' > "$TEMP/vfk-settings.json"
          cargo run -q -p vifastkey-settings -- --self-test --config "$TEMP/vfk-settings.json"
          cargo run -q -p vifastkey-settings -- --check --config "$TEMP/vfk-settings.json"
      - name: Benchmark guard (Ubuntu)
        if: runner.os == 'Linux'
        run: python3 tools/bench_guard.py

  wayland-e2e:
    name: Wayland E2E (Sway headless)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - name: Install Wayland test deps
        run: |
          sudo apt-get update
          sudo apt-get install -y libxkbcommon-dev sway wtype python3-gi gir1.2-gtk-4.0
      - name: Unit + E2E
        run: |
          (cd rust && cargo test -p vifastkey-wayland && cargo build --release -p vifastkey-wayland)
          ./linux/wayland/runtime_test.sh

  uefi:
    name: UEFI x86_64 build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-uefi
      - name: Core no_std check
        run: |
          cd rust
          cargo test -p vi-syllable --no-default-features
          cargo test -p vfk-core --no-default-features
          cargo check -p vi-syllable --no-default-features --target x86_64-unknown-uefi
          cargo check -p vfk-core --no-default-features --target x86_64-unknown-uefi
      - name: Build UEFI app
        run: cd uefi && cargo build --release
      - name: Package UEFI release
        run: |
          OUT_DIR="$RUNNER_TEMP" ./uefi/package.sh
          test -f "$RUNNER_TEMP/vifastkey-uefi-x86_64.zip"
          unzip -l "$RUNNER_TEMP/vifastkey-uefi-x86_64.zip" | grep 'EFI/BOOT/BOOTX64.EFI'

  windows-tsf-adapter:
    name: Windows TSF adapter (build x64 + x86)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: i686-pc-windows-msvc
      - name: Build vfk-ffi (x64 + x86)
        run: |
          cd rust
          cargo build --release -p vfk-ffi
          cargo build --release -p vfk-ffi --target i686-pc-windows-msvc
      - name: Build TSF x64
        run: |
          cmake -S windows/tsf -B build/tsf-x64 -A x64 -DVFK_RUST_PROFILE=release
          cmake --build build/tsf-x64 --config Release
      - name: Build TSF x86
        run: |
          cmake -S windows/tsf -B build/tsf-x86 -A Win32 `
            -DVFK_RUST_PROFILE=release `
            -DVFK_FFI_LIB_DIR="$PWD/rust/target/i686-pc-windows-msvc/release"
          cmake --build build/tsf-x86 --config Release
      - uses: actions/upload-artifact@v7
        with:
          name: ViFastKey-windows-tsf
          path: |
            build/tsf-x64/Release/vifastkey_tsf.dll
            build/tsf-x64/Release/vifastkey.dll
            build/tsf-x86/Release/vifastkey_tsf.dll
            build/tsf-x86/Release/vifastkey.dll
          if-no-files-found: error

  linux-ibus-adapter:
    name: Linux IBus adapter (core + syntax)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: python -m pip install -e "python[dev]"
      - run: python -m pytest -q python/tests/test_ibus_core.py
      - run: python -m py_compile linux/ibus/ibus_engine.py

  linux-fcitx5-adapter:
    name: Linux Fcitx5 adapter (build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - name: Cài Fcitx5 dev
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake pkg-config libfcitx5core-dev libfcitx5utils-dev
      - name: Build Rust staticlib + addon
        run: |
          cd rust
          cargo build --release -p vfk-ffi
          cd ..
          cmake -S linux/fcitx5 -B linux/fcitx5/build \
            -DVIFASTKEY_LIB="$PWD/rust/target/release/libvifastkey.a" \
            -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_TESTING=ON
          cmake --build linux/fcitx5/build -j2
          ctest --test-dir linux/fcitx5/build --output-on-failure
          test -f linux/fcitx5/build/libvifastkey.so

  android-adapter:
    name: Android IME (build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
      # v6 chuyển caching sang gradle-actions-caching (license riêng); giữ v5 cho CI MIT.
      - uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: "9.8.2"
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,x86_64-linux-android
      - name: Cài NDK + cargo-ndk
        env:
          ANDROID_HOME: /usr/local/lib/android/sdk
          ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
        run: |
          SDKM=$(find "$ANDROID_HOME/cmdline-tools" -name sdkmanager -type f | head -1)
          yes | "$SDKM" --licenses >/dev/null 2>&1 || true
          "$SDKM" "platforms;android-36" "build-tools;36.0.0" "ndk;28.2.13676358" >/dev/null
          cargo install cargo-ndk --locked
      - name: Build APK
        env:
          ANDROID_HOME: /usr/local/lib/android/sdk
          ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
        run: ./android/build.sh
      - uses: actions/upload-artifact@v7
        with:
          name: ViFastKey-android-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

  ios-adapter:
    name: iOS keyboard extension (build + engine test)
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - name: Cài XcodeGen + Rust target
        run: |
          brew install xcodegen
          rustup target add aarch64-apple-ios-sim
      - name: Build app + extension
        run: ./ios/build.sh
      - name: Engine unit tests
        run: |
          DEVICE=$(xcrun simctl list devices available | awk -F '[()]' '/iPhone/ {print $2; exit}')
          xcodebuild -project ios/ViFastKey.xcodeproj -scheme ViFastKeyHost             -sdk iphonesimulator -destination "id=$DEVICE"             -derivedDataPath ios/build ARCHS=arm64 ONLY_ACTIVE_ARCH=YES             CODE_SIGNING_ALLOWED=NO -only-testing:ViFastKeyHostTests test
      - uses: actions/upload-artifact@v7
        with:
          name: ViFastKey-ios-simulator
          path: ios/build/Build/Products/Debug-iphonesimulator/ViFastKeyHost.app
          if-no-files-found: error

  chrome-extension:
    name: Chrome extension (build + E2E)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - name: Cài wasm-bindgen
        run: cargo install wasm-bindgen-cli --version 0.2.130 --locked
      - name: Build extension
        run: ./chrome-extension/build.sh
      - name: Playwright E2E
        working-directory: chrome-extension/test
        run: |
          npm install --no-audit --no-fund
          npx playwright install --with-deps chromium
          xvfb-run -a npm test

  macos-adapter:
    name: macOS IMK adapter
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - name: Build app + self-test
        run: ./macos/build.sh
      - name: Upload app bundle
        uses: actions/upload-artifact@v7
        with:
          name: ViFastKey-macos-app
          path: macos/build/ViFastKey.app
          if-no-files-found: error

  wasm:
    name: WASM + web build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - name: Cài wasm-bindgen
        run: cargo install wasm-bindgen-cli --version 0.2.130 --locked
      - name: Dựng WASM
        run: |
          cd rust
          cargo build --release -p vfk-wasm --target wasm32-unknown-unknown
          wasm-bindgen --target web --out-dir ../web/pkg --out-name vfk_wasm \
            target/wasm32-unknown-unknown/release/vfk_wasm.wasm
      - name: Kiểm tra cú pháp JS
        run: node --input-type=module --check < web/app.js
