name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  cli:
    name: CLI (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-15, windows-latest]
    defaults:
      run:
        shell: bash
        working-directory: rust
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Build release binaries
        run: |
          cargo build --release -p vfk-cli -p vfk-charset -p vfk-suggest-cli -p vfk-ffi
          if [ "${{ runner.os }}" = "Windows" ]; then
            cargo build --release -p vfk-windows
          fi
      - name: Package
        run: |
          mkdir -p dist
          cp target/release/vfk-cli* target/release/vfk-charset* target/release/vfk-suggest* dist/ 2>/dev/null || true
          if [ "${{ runner.os }}" = "Windows" ]; then
            cp target/release/vfk-windows.exe dist/ 2>/dev/null || true
          fi
          cp crates/vfk-ffi/include/vifastkey.h dist/
          cp target/release/libvifastkey.a target/release/libvifastkey.dylib \
             target/release/libvifastkey.so target/release/vifastkey.lib \
             target/release/vifastkey.dll dist/ 2>/dev/null || true
          cp README.md dist/ 2>/dev/null || true
          if [ "${{ runner.os }}" = "Windows" ]; then
            (cd dist && 7z a ../vifastkey-windows.zip .)
          else
            tar -czf "vifastkey-$(echo '${{ runner.os }}' | tr '[:upper:]' '[:lower:]').tar.gz" -C dist .
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: vifastkey-${{ runner.os }}
          path: |
            rust/vifastkey-*.tar.gz
            rust/vifastkey-*.zip
          if-no-files-found: error

  wasm:
    name: WASM package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - name: Build wasm-bindgen package
        run: |
          cargo install wasm-bindgen-cli --version 0.2.129 --locked
          cd rust
          cargo build --release -p vfk-wasm --target wasm32-unknown-unknown
          wasm-bindgen --target web --out-dir ../web/pkg --out-name vfk_wasm \
            target/wasm32-unknown-unknown/release/vfk_wasm.wasm
          cd ../web
          zip -r ../vifastkey-wasm.zip pkg index.html app.js style.css
          cd ..
          ./chrome-extension/build.sh
          cd chrome-extension
          zip -r ../vifastkey-chrome-extension.zip dist
      - uses: actions/upload-artifact@v4
        with:
          name: vifastkey-WASM
          path: |
            vifastkey-wasm.zip
            vifastkey-chrome-extension.zip
          if-no-files-found: error

  macos-app:
    name: macOS IMK app
    runs-on: macos-15
    env:
      SIGN_ID: ${{ secrets.MACOS_SIGN_ID }}
      NOTARY_PROFILE: ${{ secrets.MACOS_NOTARY_PROFILE }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Build universal2 app
        run: |
          rustup target add x86_64-apple-darwin
          ./macos/package.sh
      - uses: actions/upload-artifact@v4
        with:
          name: vifastkey-macos-app
          path: macos/build/ViFastKey-macos-universal.zip
          if-no-files-found: error

  fcitx5:
    name: Fcitx5 addon (Linux x86_64)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Install Fcitx5 dev
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build pkg-config \
            libfcitx5core-dev libfcitx5utils-dev
      - name: Build and test
        run: |
          (cd rust && cargo build --release -p vfk-ffi)
          cmake -S linux/fcitx5 -B linux/fcitx5/build -G Ninja \
            -DVIFASTKEY_LIB="$PWD/rust/target/release/libvifastkey.a" \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX=/usr \
            -DBUILD_TESTING=ON
          cmake --build linux/fcitx5/build --parallel
          ctest --test-dir linux/fcitx5/build --output-on-failure
          mkdir -p fcitx5-root
          DESTDIR="$PWD/fcitx5-root" cmake --install linux/fcitx5/build --strip
          MULTIARCH="$(dpkg-architecture -qDEB_HOST_MULTIARCH)"
          test -f "fcitx5-root/usr/lib/${MULTIARCH}/fcitx5/libvifastkey.so"
          tar -czf vifastkey-fcitx5-linux-x86_64.tar.gz -C fcitx5-root .
      - uses: actions/upload-artifact@v4
        with:
          name: vifastkey-fcitx5
          path: vifastkey-fcitx5-linux-x86_64.tar.gz
          if-no-files-found: error

  android-apk:
    name: Android APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,x86_64-linux-android
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.8.2"
      - name: Install Android NDK
        env:
          ANDROID_HOME: /usr/local/lib/android/sdk
          ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
        run: |
          SDKM=$(find "$ANDROID_HOME/cmdline-tools" -name sdkmanager -type f | head -1)
          yes | "$SDKM" --licenses >/dev/null 2>&1 || true
          "$SDKM" "platforms;android-36" "build-tools;36.0.0" "ndk;28.2.13676358" >/dev/null
          cargo install cargo-ndk --locked
      - name: Build debug APK
        env:
          ANDROID_HOME: /usr/local/lib/android/sdk
          ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
        run: ./android/build.sh
      - uses: actions/upload-artifact@v4
        with:
          name: vifastkey-android-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

  ios-app:
    name: iOS simulator app
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Install XcodeGen + Rust target
        run: |
          brew install xcodegen
          rustup target add aarch64-apple-ios-sim
      - name: Build simulator app
        run: ./ios/package.sh
      - uses: actions/upload-artifact@v4
        with:
          name: vifastkey-ios-app
          path: ios/build/ViFastKey-ios-simulator.zip
          if-no-files-found: error

  publish:
    name: Publish GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [cli, wasm, macos-app, fcitx5, android-apk, ios-app]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - uses: softprops/action-gh-release@v2
        with:
          files: artifacts/**/*
          generate_release_notes: true
