name: release

on:
  # Tạm thời chỉ chạy tay: tránh dùng GitHub-hosted runner khi repo public.
  # TODO: chuyển job sang self-hosted rồi bật lại push/PR.
  workflow_dispatch:
permissions:
  contents: write

jobs:
  cli:
    name: CLI (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-15, windows-latest]
    defaults:
      run:
        shell: bash
        working-directory: rust
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - name: Cài thư viện GUI cho settings (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libxkbcommon-dev libwayland-dev \
            libx11-dev libxi-dev libgl1-mesa-dev libegl1-mesa-dev
      - name: Build release binaries
        run: |
          cargo build --release -p vfk-cli -p vfk-charset -p vfk-suggest-cli -p vfk-ffi -p vifastkey-settings
      - name: Package
        run: |
          mkdir -p dist
          cp target/release/vfk target/release/vfk-charset target/release/vfk-suggest \
             target/release/vifastkey-settings* dist/ 2>/dev/null || true
          if [ "${{ runner.os }}" = "Linux" ]; then
            cp ../linux/vifastkey-settings.desktop dist/
            cp ../resources/brand/vifastkey-icon-192.png dist/vifastkey.png
          fi
          cp crates/vfk-ffi/include/vifastkey.h dist/
          cp target/release/libvifastkey.a target/release/libvifastkey.dylib \
             target/release/libvifastkey.so target/release/vifastkey.lib \
             target/release/vifastkey.dll dist/ 2>/dev/null || true
          cp README.md dist/ 2>/dev/null || true
          case "${{ runner.os }}" in
            Windows) (cd dist && 7z a ../vifastkey-cli-windows-x64.zip .) ;;
            macOS) tar -czf ../vifastkey-cli-macos.tar.gz -C dist . ;;
            Linux) tar -czf ../vifastkey-cli-linux-x86_64.tar.gz -C dist . ;;
          esac
          if [ "${{ runner.os }}" = "Linux" ]; then
            mkdir -p settings-package
            cp target/release/vifastkey-settings settings-package/
            cp ../linux/vifastkey-settings.desktop settings-package/
            cp ../resources/brand/vifastkey-icon-192.png settings-package/vifastkey.png
            cp ../resources/brand/vifastkey-icon.svg settings-package/vifastkey.svg
            cp ../packaging/linux/README.md settings-package/README.md
            cp ../packaging/linux/install.sh ../packaging/linux/uninstall.sh settings-package/
            cp apps/vfk-settings/README.md settings-package/DEVELOPER.md
            cp ../LICENSE-MIT ../LICENSE-APACHE ../THIRD_PARTY_NOTICES.md settings-package/
            tar -czf ../vifastkey-settings-linux-x86_64.tar.gz -C settings-package .
          fi
      - uses: actions/upload-artifact@v7
        with:
          name: vifastkey-${{ runner.os }}
          path: |
            rust/vifastkey-*.tar.gz
            rust/vifastkey-*.zip
          if-no-files-found: error

  windows-hook:
    name: Windows hook-only package
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - name: Build Settings + hook
        run: |
          cd rust
          cargo build --release -p vifastkey-settings
      - name: Package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          powershell -NoProfile -ExecutionPolicy Bypass -File packaging\package-windows.ps1 -OutDir dist
          Copy-Item dist\vifastkey-windows-hook-*.zip dist\vifastkey-windows-hook.zip
      - uses: actions/upload-artifact@v7
        with:
          name: vifastkey-windows-hook
          path: |
            dist/vifastkey-windows-hook-*.zip
            dist/vifastkey-windows-hook.zip
          if-no-files-found: error

  wasm:
    name: WASM package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - name: Build wasm-bindgen package
        run: |
          cargo install wasm-bindgen-cli --version 0.2.130 --locked
          cd rust
          cargo build --release -p vfk-wasm --target wasm32-unknown-unknown
          wasm-bindgen --target web --out-dir ../web/pkg --out-name vfk_wasm \
            target/wasm32-unknown-unknown/release/vfk_wasm.wasm
          cd ../web
          zip -r ../vifastkey-wasm.zip pkg index.html app.js style.css
          cd ..
          ./chrome-extension/build.sh
          cd chrome-extension
          zip -r ../vifastkey-chrome-extension.zip dist
      - uses: actions/upload-artifact@v7
        with:
          name: vifastkey-WASM
          path: |
            vifastkey-wasm.zip
            vifastkey-chrome-extension.zip
          if-no-files-found: error

  uefi:
    name: UEFI x86_64 demo
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-uefi
      - name: Build package
        run: OUT_DIR="$PWD" ./uefi/package.sh
      - uses: actions/upload-artifact@v7
        with:
          name: vifastkey-uefi
          path: vifastkey-uefi-x86_64.zip
          if-no-files-found: error

  macos-app:
    name: macOS IMK app
    runs-on: macos-15
    env:
      SIGN_ID: ${{ secrets.MACOS_SIGN_ID }}
      NOTARY_PROFILE: ${{ secrets.MACOS_NOTARY_PROFILE }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - name: Build universal2 app
        run: |
          rustup target add x86_64-apple-darwin
          ./macos/package.sh
      - name: Rename release asset
        run: cp macos/build/ViFastKey-macos-universal.zip vifastkey-macos-imk-universal.zip
      - uses: actions/upload-artifact@v7
        with:
          name: vifastkey-macos-app
          path: vifastkey-macos-imk-universal.zip
          if-no-files-found: error

  fcitx5:
    name: Fcitx5 addon (Linux x86_64)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - name: Install Fcitx5 dev
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build pkg-config \
            libfcitx5core-dev libfcitx5utils-dev
      - name: Build and test
        run: |
          (cd rust && cargo build --release -p vfk-ffi)
          cmake -S linux/fcitx5 -B linux/fcitx5/build -G Ninja \
            -DVIFASTKEY_LIB="$PWD/rust/target/release/libvifastkey.a" \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX=/usr \
            -DBUILD_TESTING=ON
          cmake --build linux/fcitx5/build --parallel
          ctest --test-dir linux/fcitx5/build --output-on-failure
          mkdir -p fcitx5-root
          DESTDIR="$PWD/fcitx5-root" cmake --install linux/fcitx5/build --strip
          MULTIARCH="$(dpkg-architecture -qDEB_HOST_MULTIARCH)"
          test -f "fcitx5-root/usr/lib/${MULTIARCH}/fcitx5/libvifastkey.so"
          tar -czf vifastkey-fcitx5-linux-x86_64.tar.gz -C fcitx5-root .
      - uses: actions/upload-artifact@v7
        with:
          name: vifastkey-fcitx5
          path: vifastkey-fcitx5-linux-x86_64.tar.gz
          if-no-files-found: error

  linux-wayland:
    name: Linux Wayland package
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - name: Install deps
        run: |
          sudo apt-get update
          sudo apt-get install -y libxkbcommon-dev
      - name: Build and test
        run: |
          (cd rust && cargo test -p vifastkey-wayland && cargo build --release -p vifastkey-wayland)
          rm -rf wayland-package
          mkdir -p wayland-package
          cp rust/target/release/vifastkey-wayland wayland-package/
          cp linux/wayland/vifastkey-wayland.service linux/wayland/install.sh \
             linux/wayland/README.md wayland-package/
          tar -czf vifastkey-wayland-linux-x86_64.tar.gz -C wayland-package .
      - uses: actions/upload-artifact@v7
        with:
          name: vifastkey-wayland
          path: vifastkey-wayland-linux-x86_64.tar.gz
          if-no-files-found: error

  linux-ibus:
    name: Linux IBus package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Build Python wheel + package
        run: |
          python -m pip install --upgrade build
          (cd python && python -m build --wheel)
          rm -rf ibus-package
          mkdir -p ibus-package
          cp linux/ibus/ibus_engine.py linux/ibus/install.sh \
             linux/ibus/vifastkey.xml.in linux/ibus/README.md ibus-package/
          cp python/dist/vifastkey-*.whl ibus-package/
          tar -czf vifastkey-ibus-linux.tar.gz -C ibus-package .
      - uses: actions/upload-artifact@v7
        with:
          name: vifastkey-ibus
          path: vifastkey-ibus-linux.tar.gz
          if-no-files-found: error

  android-apk:
    name: Android APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,x86_64-linux-android
      # v6 chuyển caching sang gradle-actions-caching (license riêng); giữ v5 cho CI MIT.
      - uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: "9.8.2"
      - name: Install Android NDK
        env:
          ANDROID_HOME: /usr/local/lib/android/sdk
          ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
        run: |
          SDKM=$(find "$ANDROID_HOME/cmdline-tools" -name sdkmanager -type f | head -1)
          yes | "$SDKM" --licenses >/dev/null 2>&1 || true
          "$SDKM" "platforms;android-36" "build-tools;36.0.0" "ndk;28.2.13676358" >/dev/null
          cargo install cargo-ndk --locked
      - name: Build debug APK
        env:
          ANDROID_HOME: /usr/local/lib/android/sdk
          ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
        run: ./android/build.sh
      - name: Rename debug APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk vifastkey-android-debug.apk
      - uses: actions/upload-artifact@v7
        with:
          name: vifastkey-android-apk
          path: vifastkey-android-debug.apk
          if-no-files-found: error
      - name: Build signed release if secrets are configured
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          VIFASTKEY_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          VIFASTKEY_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          VIFASTKEY_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -z "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "Android signing secrets not configured; skipping release build"
            exit 0
          fi
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/vifastkey.jks"
          export VIFASTKEY_KEYSTORE="$RUNNER_TEMP/vifastkey.jks"
          ./android/build.sh release
          gradle -p android bundleRelease --no-daemon
      - name: Rename release assets
        run: |
          if [ -f android/app/build/outputs/apk/release/app-release.apk ]; then
            cp android/app/build/outputs/apk/release/app-release.apk vifastkey-android-release.apk
          fi
          if [ -f android/app/build/outputs/bundle/release/app-release.aab ]; then
            cp android/app/build/outputs/bundle/release/app-release.aab vifastkey-android-release.aab
          fi
      - uses: actions/upload-artifact@v7
        with:
          name: vifastkey-android-release
          path: |
            vifastkey-android-release.apk
            vifastkey-android-release.aab
          if-no-files-found: ignore

  ios-app:
    name: iOS simulator app
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - name: Install XcodeGen + Rust target
        run: |
          brew install xcodegen
          rustup target add aarch64-apple-ios-sim
      - name: Build simulator app
        run: ./ios/package.sh
      - name: Rename release asset
        run: cp ios/build/ViFastKey-ios-simulator.zip vifastkey-ios-simulator.zip
      - uses: actions/upload-artifact@v7
        with:
          name: vifastkey-ios-app
          path: vifastkey-ios-simulator.zip
          if-no-files-found: error

  publish:
    name: Publish GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [cli, windows-hook, wasm, uefi, macos-app, fcitx5, linux-ibus, android-apk, ios-app]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Verify tag matches workspace version
        run: |
          version="$(sed -n 's/^version = "\([^"]*\)"/\1/p' rust/Cargo.toml | head -1)"
          test -n "$version"
          test "v$version" = "${GITHUB_REF_NAME}" || {
            echo "Tag ${GITHUB_REF_NAME} không khớp workspace version v$version" >&2
            exit 1
          }
      - uses: actions/download-artifact@v8
        with:
          path: artifacts
      - name: Generate SHA256SUMS
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import hashlib

          files = [p for p in Path("artifacts").rglob("*") if p.is_file()]
          files.sort(key=lambda p: p.name)
          with open("sha256sums.txt", "w", encoding="utf-8") as out:
              for path in files:
                  digest = hashlib.sha256(path.read_bytes()).hexdigest()
                  out.write(f"{digest}  {path.name}\n")
          PY
      - uses: softprops/action-gh-release@v3
        with:
          name: ViFastKey ${{ github.ref_name }}
          body: |
            ViFastKey ${{ github.ref_name }} — bộ gõ tiếng Việt Telex, Simple Telex, VNI, VIQR.

            **Windows:** tải `vifastkey-windows-hook.zip`, giải nén và chạy `install.ps1`;
            một binary hook-only, không cần TSF/ký. Chọn English (US) trong input source.
            **Linux:** `vifastkey-ibus-linux.tar.gz` (IBus), `vifastkey-fcitx5-linux-x86_64.tar.gz` (Fcitx5),
            `vifastkey-settings-linux-x86_64.tar.gz` (UI cấu hình).
            **Web/WASM:** `vifastkey-wasm.zip`.
            **macOS:** `vifastkey-macos-imk-universal.zip`.
            **UEFI x86_64:** `vifastkey-uefi-x86_64.zip` — demo editor Telex/VNI chạy trước khi OS boot;
            giải nén vào USB FAT32, tắt Secure Boot, boot `\EFI\BOOT\BOOTX64.EFI`.
            **Android/iOS/extension:** xem các asset còn lại.

            Kiểm tra file bằng `sha256sums.txt` trước khi cài.
          files: |
            artifacts/**/*
            sha256sums.txt
          fail_on_unmatched_files: true
          generate_release_notes: false
          make_latest: true
