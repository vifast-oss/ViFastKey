[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "vifastkey"
version = "0.1.1"
description = "Bộ gõ tiếng Việt: lõi chuỗi phím thô → chữ Việt (Telex, Simple Telex, VNI)"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{ name = "ViFastKey contributors" }]
keywords = ["vietnamese", "ime", "telex", "vni", "input-method", "keyboard"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Software Development :: Internationalization",
  "Topic :: Text Processing :: Linguistic",
]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]

[project.scripts]
vfk = "apps.vfk_cli:main"
vfk-charset = "apps.vfk_charset:main"
vfk-suggest = "apps.vfk_suggest:main"
vfk-emoji = "apps.vfk_emoji:main"

[project.urls]
Homepage = "https://github.com/dvchd/ViFastKey"
Repository = "https://github.com/dvchd/ViFastKey"
Documentation = "https://github.com/dvchd/ViFastKey#readme"

[tool.setuptools]
py-modules = ["vfk_adapter_core"]

[tool.setuptools.packages.find]
where = ["."]
include = ["vi_syllable*", "vfk_core*", "vfk_engine*", "vfk_ffi*", "vfk_suggest*", "adapters*", "apps*", "tools*"]
exclude = ["tests*", "conformance*"]

[tool.setuptools.package-data]
adapters = ["data/*.txt"]
vfk_core = ["data/*.json", "data/*.txt"]
vfk_engine = ["app_profiles.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 110
target-version = "py310"
exclude = ["conformance"]

[tool.ruff.lint]
select = ["E9", "F", "W", "I"]

[tool.ruff.lint.isort]
known-first-party = ["vi_syllable", "vfk_core", "vfk_engine", "vfk_ffi", "vfk_adapter_core", "vfk_suggest", "adapters", "apps", "tools"]
