plugins {
    id 'com.android.application'
}

android {
    namespace 'app.vifastkey'
    compileSdk 36

    defaultConfig {
        applicationId 'app.vifastkey'
        minSdk 26
        targetSdk 36
        versionCode 25
        versionName '0.1.0'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    signingConfigs {
        release {
            def storePath = System.getenv("VIFASTKEY_KEYSTORE")
            if (storePath) {
                storeFile file(storePath)
                storePassword System.getenv("VIFASTKEY_KEYSTORE_PASSWORD")
                keyAlias System.getenv("VIFASTKEY_KEY_ALIAS")
                keyPassword System.getenv("VIFASTKEY_KEY_PASSWORD")
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            if (System.getenv("VIFASTKEY_KEYSTORE")) {
                signingConfig signingConfigs.release
            }
        }
    }
}
